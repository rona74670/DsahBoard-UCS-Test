<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Right-Sizing | תא הטייס</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .vc-header-meta { display:flex; gap:0.6rem; align-items:center; flex-wrap:wrap; }
    .vc-badge { background:#0d1a2d; color:#58a6ff; border:1px solid #58a6ff; border-radius:5px; padding:0.2rem 0.6rem; font-size:0.8rem; font-weight:600; }
    .kpi-row { display:flex; flex-wrap:wrap; gap:1rem; padding:1.2rem 1.5rem 0.5rem; }
    .kpi-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1rem 1.4rem; min-width:150px; flex:1 1 150px; display:flex; flex-direction:column; gap:0.25rem; }
    .kpi-label { font-size:0.7rem; color:var(--muted); letter-spacing:.06em; font-weight:600; }
    .kpi-value { font-size:1.6rem; font-weight:700; color:var(--text); line-height:1.1; direction:ltr; unicode-bidi:isolate; }
    .kpi-detail { font-size:0.68rem; color:var(--muted); margin-top:0.15rem; }
    .kpi-card.red .kpi-value { color:#f85149; }
    .kpi-card.blue .kpi-value { color:#58a6ff; }
    .kpi-card.green .kpi-value { color:#3fb950; }
    .kpi-card.amber .kpi-value { color:#e3b341; }

    .vc-select, .vc-search, .vc-input { background:var(--card-bg,#0d1117); border:1px solid var(--border); border-radius:6px; padding:0.4rem 0.7rem; color:var(--text); font-size:0.85rem; }
    .vc-input.num { width:64px; text-align:center; }
    .vc-select:focus, .vc-search:focus, .vc-input:focus { outline:none; border-color:#58a6ff; }
    .export-btn { background:#161b22; color:#58a6ff; border:1px solid #1f6feb; border-radius:6px; padding:0.35rem 0.9rem; font-size:0.82rem; cursor:pointer; white-space:nowrap; }
    .export-btn:hover { background:#1f6feb; color:#fff; }
    .vc-toolbar { display:flex; gap:0.8rem; align-items:center; padding:0.7rem 1.5rem; flex-wrap:wrap; border-bottom:1px solid var(--border); background:var(--surface); }
    .vc-toolbar label { font-size:0.8rem; color:var(--muted); display:flex; align-items:center; gap:0.35rem; }

    table.data-table { width:100%; border-collapse:collapse; font-size:0.82rem; }
    .data-table th { background:var(--surface); color:var(--muted); font-size:0.72rem; font-weight:700; padding:0.5rem 0.7rem; border-bottom:1px solid var(--border); text-align:right; white-space:nowrap; }
    .data-table th.sortable { cursor:pointer; user-select:none; }
    .data-table th.sortable:hover { color:var(--text); }
    .data-table td { padding:0.45rem 0.7rem; border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:middle; }
    .data-table tbody tr:hover td { background:rgba(88,166,255,.04); }
    .center { text-align:center; }
    .name-cell { font-weight:600; max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .cust-row { cursor:pointer; }
    .cust-row.expanded > td:first-child::before { content:'▼ '; font-size:0.6rem; color:var(--accent); }
    .cust-row:not(.expanded) > td:first-child::before { content:'▶ '; font-size:0.6rem; color:var(--muted); }
    .vm-sub-row td { background:#0a0f16 !important; font-size:0.78rem; padding:0.35rem 0.7rem; }
    .env-badge { display:inline-block; padding:0.05rem 0.45rem; border-radius:4px; font-size:0.68rem; font-weight:700; }
    .env-badge.TC     { background:#0d1a2d; color:#79c0ff; border:1px solid #1f6feb; }
    .env-badge.TC8    { background:#001a2d; color:#79c0ff; border:1px solid #79c0ff; }
    .env-badge.PT     { background:#0d2010; color:#3fb950; border:1px solid #2ea043; }
    .env-badge.Fattal { background:#2d1040; color:#d2a8ff; border:1px solid #8957e5; }
    .muted { color:var(--muted); }
    .empty-row td { color:var(--muted); font-style:italic; text-align:center; padding:1.5rem; }
    .row-export-btn { background:#0d1a2d; color:#79c0ff; border:1px solid #1f6feb; border-radius:5px; padding:0.1rem 0.5rem; font-size:0.7rem; cursor:pointer; white-space:nowrap; margin-inline-start:0.5rem; }
    .row-export-btn:hover { background:#1f6feb; color:#fff; }
    .rec { direction:ltr; unicode-bidi:isolate; display:inline-block; font-weight:700; }
    .rec .arrow { color:var(--muted); margin:0 0.25rem; font-weight:400; }
    .rec.add    { color:#f85149; }
    .rec.reduce { color:#58a6ff; }
    .rec.ok     { color:#3fb950; }
    .rec.prot   { color:#d2a8ff; }
    .rec.check  { color:#d29922; }
    .sub { display:block; font-size:0.68rem; color:var(--muted); direction:ltr; unicode-bidi:isolate; font-weight:400; }
    .act { display:inline-block; padding:0.1rem 0.5rem; border-radius:10px; font-size:0.7rem; font-weight:700; white-space:nowrap; }
    .act-add    { background:#2d0000; color:#f85149; border:1px solid #f85149; }
    .act-reduce { background:#0d1a2d; color:#58a6ff; border:1px solid #1f6feb; }
    .act-ok     { background:#0d2010; color:#3fb950; border:1px solid #2ea043; }
    .act-check  { background:#2b2108; color:#d29922; border:1px solid #9e6a03; }
    .act-insufficient { background:#161b22; color:#8b949e; border:1px solid #484f58; }
    #rs-note { font-size:0.78rem; color:var(--muted); padding:0.6rem 1.5rem 0; line-height:1.6; }
    #rs-banner { margin:0.8rem 1.5rem 0; padding:0.6rem 0.9rem; background:#2d1a00; border:1px solid #e3b341; color:#e3b341; border-radius:6px; font-size:0.82rem; display:none; }
  </style>
</head>
<body>
<script src="/static/auth.js"></script>
<script>if(localStorage.getItem('sb-collapsed')==='1')document.body.className+=' sb-collapsed';</script>
<div id="layout">
  <aside id="sidebar"></aside>

  <div id="content-wrap">
  <header>
    <div class="header-inner">
      <span class="logo">&#x2696;&#xFE0F; Right-Sizing — המלצות להוספה / הפחתת משאבים</span>
      <div class="vc-header-meta"><span class="vc-badge" id="hdr-total">טוען...</span></div>
    </div>
  </header>

  <div class="vc-toolbar">
    <label>חלון ניתוח:
      <select class="vc-select" id="f-days" onchange="load()">
        <option value="30" selected>30 יום</option>
        <option value="60">60 יום</option>
        <option value="90">90 יום</option>
        <option value="183">6 חודשים</option>
      </select>
    </label>
    <label title="מספר ימי נתונים מינימלי לפני שמוציאים המלצה על שרת">מינימום ימי נתונים: <input class="vc-input num" id="f-min" type="number" min="1" max="183" value="14" onchange="load()" /></label>
    <label title="המלצת CPU מכוונת שהפיק החוזר יגיע לאחוז הזה מהקיבולת">יעד פיק CPU %: <input class="vc-input num" id="f-ct" type="number" min="30" max="95" value="70" onchange="load()" /></label>
    <label>יעד פיק RAM %: <input class="vc-input num" id="f-mt" type="number" min="30" max="95" value="80" onchange="load()" /></label>
    <label>סביבה:
      <select class="vc-select" id="f-env" onchange="render()">
        <option value="">הכל</option><option>TC</option><option>TC8</option><option>PT</option><option>Fattal</option>
      </select>
    </label>
    <label>המלצה:
      <select class="vc-select" id="f-act" onchange="render()">
        <option value="">הכל</option><option value="add">רק להוספה</option><option value="reduce">רק להפחתה</option><option value="change">הוספה או הפחתה</option><option value="check">לבדוק (Co-Stop / Limit)</option><option value="insufficient">אין מספיק נתונים</option>
      </select>
    </label>
<label>לקוח:
      <select class="vc-select" id="f-cust" onchange="render()" style="max-width:220px"><option value="">כל הלקוחות</option></select>
    </label>
    <input class="vc-search" id="f-search" placeholder="חיפוש שרת / לקוח / פריוריטי…" oninput="render()" style="min-width:220px" />
    <label><input type="checkbox" id="f-flat" onchange="render()" /> רשימת שרתים (ללא קיבוץ)</label>
    <button class="export-btn" id="btn-export" onclick="exportExcel()" title="מייצא את השרתים לפי הסינון הנוכחי">&#x1F4E5; יצוא ל-Excel</button>
  </div>
  <div id="rs-banner"></div>
  <div id="rs-note"></div>

  <div class="kpi-row">
    <div class="kpi-card blue"><div class="kpi-label">שרתים עם המלצה מהימנה</div><div class="kpi-value" id="k-rel">–</div><div class="kpi-detail" id="k-rel-d"></div></div>
    <div class="kpi-card red"><div class="kpi-label">להוספת משאבים</div><div class="kpi-value" id="k-add">–</div><div class="kpi-detail" id="k-add-d"></div></div>
    <div class="kpi-card amber"><div class="kpi-label">להפחתת משאבים</div><div class="kpi-value" id="k-red">–</div><div class="kpi-detail" id="k-red-d"></div></div>
    <div class="kpi-card green"><div class="kpi-label">תקינים</div><div class="kpi-value" id="k-ok">–</div><div class="kpi-detail">בגודל מתאים</div></div>
    <div class="kpi-card"><div class="kpi-label">אין מספיק נתונים</div><div class="kpi-value" id="k-ins" style="color:var(--muted)">–</div><div class="kpi-detail" id="k-ins-d"></div></div>
  </div>

  <div style="padding:0.6rem 1.5rem 1.5rem">
    <table class="data-table">
      <thead id="thead"></thead>
      <tbody id="tbody"><tr class="empty-row"><td colspan="9">⏳ טוען נתונים...</td></tr></tbody>
    </table>
  </div>
  </div>
</div>

<script src="/static/exceljs.min.js"></script>
<script src="/static/sidebar.js?v=20261005c"></script>
<script>
var _rows = [], _cfg = {}, _customerMap = {}, _expanded = new Set();
var _sortCol = 'impact', _sortDir = -1;
var e = window.escapeHtml || function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var ACT_LABEL = { add: 'להוסיף', reduce: 'להפחית', check: 'לבדוק (Co-Stop / Limit)', ok: 'תקין', insufficient: 'אין מספיק נתונים' };

// The VM-level action: add wins over reduce (a VM short on one resource isn't "reduce"), and a
// VM needs a trusted recommendation (>= min days at its current size) on at least one resource.
function vmAction(v) {
  var a = v.cpu.action, b = v.mem.action;
  if (a === 'add' || b === 'add') return 'add';
  if (a === 'limited' || a === 'contention') return 'check';   // CPU Limit set / Co-Stop blocks adding vCPUs
  if (a === 'reduce' || b === 'reduce') return 'reduce';
  if ((a === 'insufficient' && b === 'protected') || (a === 'protected' && b === 'insufficient')) return 'insufficient';
  if (a === 'insufficient' && b === 'insufficient') return 'insufficient';
  return 'ok';
}
function annotate(v) {
  v._act = vmAction(v);
  v._dcpu = v.cpu.recommended != null ? v.cpu.recommended - v.cpu.current : 0;
  v._dmem = v.mem.recommended != null ? v.mem.recommended - v.mem.current : 0;
  // sorting weight: relative size of the proposed change
  v._impact = Math.abs(v._dcpu) / (v.cpu.current || 1) + Math.abs(v._dmem) / (v.mem.current || 1);
}
function recCell(r, unit) {
  if (r.action === 'protected')
    return '<span class="rec prot" title="' + e(r.protected_reason) + '">' + r.current + unit + ' 🔒</span>' +
      '<span class="sub" title="' + e(r.protected_reason) + '">שרת DB — לא להפחית (' + r.peak_p95 + '% P95)</span>';
  if (r.recommended == null) return '<span class="muted">—</span>' + '<span class="sub">' + r.days + ' ימים</span>';
  var cls = (r.action === 'limited' || r.action === 'contention') ? 'check' : r.action;
  var d = r.delta;
  return '<span class="rec ' + cls + '">' + r.current + unit + '<span class="arrow">→</span>' + r.recommended + unit +
    (d ? ' (' + (d > 0 ? '+' : '') + d + ')' : '') + '</span>' +
    '<span class="sub">P95 ' + r.peak_p95 + '% · max ' + r.peak_max + '% · ' + r.days + ' ימים</span>' +
    (r.reason ? '<span class="sub" style="color:#d29922" title="' + e(r.reason) + '">' + e(r.reason) + '</span>' : '');
}
function actBadge(a) { return '<span class="act act-' + a + '"' + (a === 'check' ? ' title="יש Limit על ה-CPU או Co-Stop חוזר. הסיבה מופיעה מתחת לשורת השרת. הסבר מלא: בדף הביצועים ← ❓ הסבר על המדדים"' : '') + '>' + ACT_LABEL[a] + '</span>'; }

async function load() {
  var q = new URLSearchParams({ days: document.getElementById('f-days').value, min_days: document.getElementById('f-min').value,
    cpu_target: document.getElementById('f-ct').value, mem_target: document.getElementById('f-mt').value });
  document.getElementById('tbody').innerHTML = '<tr class="empty-row"><td colspan="9">⏳ טוען נתונים...</td></tr>';
  try {
    var res = await Promise.all([
      fetch('/api/vcenter/perf/rightsizing?' + q, { credentials: 'include' }).then(function (r) { return r.json(); }),
      fetch('/api/customers/map', { credentials: 'include' }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }),
      fetch('/api/vcenter/perf/status', { credentials: 'include' }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }),
    ]);
    _rows = res[0].data || []; _cfg = res[0].config || {}; _customerMap = res[1] || {};
    _rows.forEach(annotate);
    fillCustomers();
    var st = res[2] || {};
    var banner = document.getElementById('rs-banner');
    var maxDays = _rows.reduce(function (m, v) { return Math.max(m, v.days); }, 0);
    if (maxDays < (_cfg.min_days || 14)) {
      banner.style.display = 'block';
      banner.textContent = 'עדיין לא נצברו מספיק נתונים להמלצות מהימנות: נאספו עד ' + maxDays + ' ימים, ונדרשים לפחות ' + (_cfg.min_days || 14) +
        '. מומלץ להמתין לפחות חודש כדי לתפוס גם עומסים חודשיים (סגירת חודש, גיבויים, תחזוקה).' + (st.daily_from ? ' תחילת איסוף: ' + st.daily_from + '.' : '');
    } else banner.style.display = 'none';
  } catch (x) {
    document.getElementById('tbody').innerHTML = '<tr class="empty-row"><td colspan="9">שגיאה בטעינת הנתונים</td></tr>';
    return;
  }
  render();
}


// Customer dropdown: built from the loaded rows (keeps the current choice across reloads).
function fillCustomers() {
  var sel = document.getElementById('f-cust'), cur = sel.value, seen = {};
  _rows.forEach(function (v) { var k = v.sap_number || '__nosap__'; if (!seen[k]) seen[k] = _customerMap[v.sap_number] || (v.sap_number || 'ללא פריוריטי'); });
  var keys = Object.keys(seen).sort(function (a, b) { return seen[a].localeCompare(seen[b], 'he'); });
  sel.innerHTML = '<option value="">כל הלקוחות</option>' + keys.map(function (k) { return '<option value="' + e(k) + '">' + e(seen[k]) + '</option>'; }).join('');
  sel.value = seen[cur] !== undefined ? cur : '';
}
function custName(key) { var o = document.querySelector('#f-cust option[value="' + key.replace(/"/g, '\\"') + '"]'); return o ? o.textContent : key; }
function safePart(t) { return String(t || '').trim().replace(/[\\/:*?"<>|]+/g, '_').replace(/\s+/g, '_').slice(0, 60); }

function filtered() {
  var env = document.getElementById('f-env').value, act = document.getElementById('f-act').value;
  var q = document.getElementById('f-search').value.trim().toLowerCase();
  var cu = document.getElementById('f-cust').value;
  return _rows.filter(function (v) {
    if (env && v.environment !== env) return false;
    if (cu && (v.sap_number || '__nosap__') !== cu) return false;
    if (act === 'change' ? !(v._act === 'add' || v._act === 'reduce') : (act && v._act !== act)) return false;
    if (q && !((v.vm_name || '').toLowerCase().includes(q) || (v.sap_number || '').toLowerCase().includes(q) ||
               (_customerMap[v.sap_number] || '').toLowerCase().includes(q))) return false;
    return true;
  });
}
function sortVal(o, col) {
  switch (col) {
    case 'name': return (o.name || o.vm_name || '').toLowerCase();
    case 'impact': return o._impact != null ? o._impact : (o.impact || 0);
    case 'vms': return o.vms ? o.vms.length : 0;
    case 'cpu': return o.cpu ? (o._dcpu || 0) : (o.dcpu || 0);
    case 'mem': return o.mem ? (o._dmem || 0) : (o.dmem || 0);
    default: return 0;
  }
}
function sortBy(c) { if (_sortCol === c) _sortDir *= -1; else { _sortCol = c; _sortDir = (c === 'name') ? 1 : -1; } render(); }
function cmp(a, b) { var x = sortVal(a, _sortCol), y = sortVal(b, _sortCol); return x < y ? -_sortDir : x > y ? _sortDir : 0; }
function th(l, c, x) { var ar = _sortCol === c ? (_sortDir === 1 ? '↑' : '↓') : '↕'; return '<th class="sortable' + (x ? ' ' + x : '') + '" onclick="sortBy(\'' + c + '\')">' + l + ' <span style="opacity:.6">' + ar + '</span></th>'; }

function vmRow(v, indent) {
  return '<tr class="vm-sub-row"><td class="name-cell" style="padding-right:' + (indent ? '2rem' : '0.7rem') + '" title="' + e(v.vm_name) + '">' + e(v.vm_name) + '</td>' +
    '<td><span class="env-badge ' + e(v.environment) + '">' + e(v.environment) + '</span></td>' +
    '<td class="center">' + recCell(v.cpu, '') + '</td><td class="center">' + recCell(v.mem, 'GB') + '</td>' +
    '<td class="center">' + actBadge(v._act) + '</td><td colspan="4" class="muted">' + (v.confidence === 'high' ? 'מהימנות גבוהה' : v.confidence === 'medium' ? 'מהימנות בינונית (פחות מ-30 ימים)' : '') + '</td></tr>';
}

function render() {
  var vms = filtered();
  var rel = vms.filter(function (v) { return v._act !== 'insufficient'; });
  var add = vms.filter(function (v) { return v._act === 'add'; });
  var red = vms.filter(function (v) { return v._act === 'reduce'; });
  function sum(arr, f) { return arr.reduce(function (s, v) { return s + f(v); }, 0); }
  // totals count only the actual shortfall (add) / surplus (reduce) per resource
  var addCpu = sum(vms, function (v) { return v._dcpu > 0 ? v._dcpu : 0; }), addMem = sum(vms, function (v) { return v._dmem > 0 ? v._dmem : 0; });
  var redCpu = sum(vms, function (v) { return v._dcpu < 0 ? -v._dcpu : 0; }), redMem = sum(vms, function (v) { return v._dmem < 0 ? -v._dmem : 0; });
  document.getElementById('hdr-total').textContent = vms.length + ' שרתים';
  document.getElementById('btn-export').innerHTML = '&#x1F4E5; יצוא ל-Excel (' + vms.length + ' שרתים)';
  document.getElementById('k-rel').textContent = rel.length;
  document.getElementById('k-rel-d').textContent = 'מתוך ' + vms.length + ' שרתים (≥ ' + (_cfg.min_days || 14) + ' ימי נתונים)';
  document.getElementById('k-add').textContent = add.length;
  document.getElementById('k-add-d').textContent = 'סה"כ +' + addCpu + ' vCPU · +' + Math.round(addMem * 10) / 10 + ' GB RAM';
  document.getElementById('k-red').textContent = red.length;
  document.getElementById('k-red-d').textContent = 'סה"כ אפשר לפנות ' + redCpu + ' vCPU · ' + Math.round(redMem * 10) / 10 + ' GB RAM';
  document.getElementById('k-ok').textContent = vms.filter(function (v) { return v._act === 'ok'; }).length;
  var ins = vms.filter(function (v) { return v._act === 'insufficient'; }).length;
  document.getElementById('k-ins').textContent = ins;
  document.getElementById('k-ins-d').textContent = ins ? 'פחות מ-' + (_cfg.min_days || 14) + ' ימי נתונים בגודל הנוכחי' : '';
  document.getElementById('rs-note').innerHTML =
    'ההמלצה מבוססת על <b>פיקים</b> ולא על ממוצעים: לכל שרת נלקח פיק יומי, והגודל מחושב לפי אחוזון 95 של הפיקים היומיים (הפיק שחוזר — יום חריג בודד לא משפיע; ה-max מוצג לצידו). ' +
    'הגודל המומלץ נקבע כך שהפיק החוזר יגיע ל-' + (_cfg.cpu_target || 70) + '% מה-CPU ול-' + (_cfg.mem_target || 80) + '% מה-RAM. ' +
    'שינוי קטן מ-15% לא מומלץ. אם בחלון השרת הגיע לרוויה (CPU ≥ 90% / RAM ≥ 95%) לא תומלץ הפחתה. ימים שלפני שינוי הגודל האחרון של השרת לא נספרים. ' +
    '<b>🔒 שרתי DB / Cache:</b> שרתים כאלה מנצלים את כל הזיכרון שהוקצה להם, ולכן <b>לא תומלץ עליהם הפחתת RAM</b> (רק הוספה, אם נדרש). הזיהוי לפי "תפקיד השרת" (SQL / DB / סאפ …) או לפי השם (sql, db, oracle, hana, cache …). הפחתת CPU לשרתים כאלה כן יכולה להופיע.';

  var thead = document.getElementById('thead'), tbody = document.getElementById('tbody');
  if (!vms.length) { thead.innerHTML = ''; tbody.innerHTML = '<tr class="empty-row"><td colspan="9">' + (_rows.length ? 'אין תוצאות לפי הסינון' : 'אין עדיין נתונים. האיסוף רץ ברקע.') + '</td></tr>'; return; }

  var flat = document.getElementById('f-flat').checked;
  if (flat) {
    thead.innerHTML = '<tr>' + th('שם VM', 'name') + '<th>סביבה</th>' + th('vCPU (נוכחי → מומלץ)', 'cpu', 'center') + th('RAM (נוכחי → מומלץ)', 'mem', 'center') + th('המלצה', 'impact', 'center') + '<th colspan="4">לקוח</th></tr>';
    tbody.innerHTML = vms.slice().sort(cmp).map(function (v) {
      return vmRow(v, false).replace(/<td colspan="4" class="muted">.*?<\/td>/, '<td colspan="4" class="muted">' + e(_customerMap[v.sap_number] || v.sap_number || '—') + '</td>');
    }).join('');
    return;
  }
  thead.innerHTML = '<tr>' + th('לקוח / שרת', 'name') + '<th>סביבה</th>' + th('vCPU (נוכחי → מומלץ)', 'cpu', 'center') + th('RAM (נוכחי → מומלץ)', 'mem', 'center') + th('המלצה', 'impact', 'center') + th('שרתים', 'vms', 'center') + '<th class="center">להוסיף</th><th class="center">להפחית</th><th></th></tr>';
  var map = {};
  vms.forEach(function (v) {
    var k = v.sap_number || '__nosap__';
    var g = map[k] || (map[k] = { key: k, sap: v.sap_number || '', name: _customerMap[v.sap_number] || (v.sap_number || 'ללא פריוריטי'), vms: [] });
    g.vms.push(v);
  });
  var groups = Object.values(map).map(function (g) {
    g.dcpu = sum(g.vms, function (v) { return v._dcpu; }); g.dmem = sum(g.vms, function (v) { return v._dmem; });
    g.impact = sum(g.vms, function (v) { return v._impact; });
    g.nAdd = g.vms.filter(function (v) { return v._act === 'add'; }).length;
    g.nRed = g.vms.filter(function (v) { return v._act === 'reduce'; }).length;
    return g;
  }).sort(cmp);
  var html = '';
  groups.forEach(function (g) {
    var open = _expanded.has(g.key);
    function net(d, u) { return d ? '<span class="rec ' + (d > 0 ? 'add' : 'reduce') + '">' + (d > 0 ? '+' : '') + Math.round(d * 10) / 10 + u + '</span><span class="sub">נטו</span>' : '<span class="muted">—</span>'; }
    html += '<tr class="cust-row' + (open ? ' expanded' : '') + '" onclick="toggleCustomer(\'' + g.key.replace(/'/g, "\\'") + '\')"><td class="name-cell">' + e(g.name) +
      (g.sap ? ' <span class="muted" style="font-size:0.7rem">#' + e(g.sap) + '</span>' : '') +
      ' <button class="row-export-btn" onclick="exportExcel(event,this.dataset.k)" data-k="' + e(g.key) + '">&#x1F4E5; Excel</button></td><td></td>' +
      '<td class="center">' + net(g.dcpu, '') + '</td><td class="center">' + net(g.dmem, 'GB') + '</td><td></td>' +
      '<td class="center" style="font-weight:700">' + g.vms.length + '</td>' +
      '<td class="center">' + (g.nAdd ? '<span class="act act-add">' + g.nAdd + '</span>' : '<span class="muted">0</span>') + '</td>' +
      '<td class="center">' + (g.nRed ? '<span class="act act-reduce">' + g.nRed + '</span>' : '<span class="muted">0</span>') + '</td><td></td></tr>';
    if (open) g.vms.slice().sort(cmp).forEach(function (v) { html += vmRow(v, true); });
  });
  tbody.innerHTML = html;
}
function toggleCustomer(k) { if (_expanded.has(k)) _expanded.delete(k); else _expanded.add(k); render(); }

async function exportExcel(ev, onlyKey) {
  if (ev && ev.stopPropagation) ev.stopPropagation();
  var vms = filtered().filter(function (v) { return !onlyKey || (v.sap_number || '__nosap__') === onlyKey; }).slice().sort(function (a, b) { return b._impact - a._impact; });
  var wb = new ExcelJS.Workbook();
  var ws = wb.addWorksheet('Right-Sizing', { views: [{ rightToLeft: true, state: 'frozen', ySplit: 1 }] });
  var cols = ['לקוח', 'פריוריטי #', 'שם VM', 'סביבה', 'המלצה', 'ימי נתונים', 'מהימנות',
    'vCPU נוכחי', 'vCPU מומלץ', 'Δ vCPU', 'פיק CPU P95 %', 'פיק CPU max %',
    'RAM נוכחי (GB)', 'RAM מומלץ (GB)', 'Δ RAM (GB)', 'פיק RAM P95 %', 'פיק RAM max %'];
  ws.columns = cols.map(function (c) { return { header: c, width: Math.max(c.length + 4, 12) }; });
  ws.getRow(1).font = { bold: true, color: { argb: 'FFFFFFFF' } };
  ws.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1F6FEB' } };
  var conf = { high: 'גבוהה', medium: 'בינונית', none: 'אין' };
  vms.forEach(function (v) {
    var c = v.cpu, m = v.mem;
    var row = ws.addRow([_customerMap[v.sap_number] || '', v.sap_number || '', v.vm_name, v.environment, ACT_LABEL[v._act], v.days, conf[v.confidence],
      c.current, c.recommended, c.recommended == null ? '' : c.delta, c.peak_p95, c.peak_max,
      m.current, m.recommended, m.recommended == null ? '' : m.delta, m.peak_p95, m.peak_max]);
    var color = v._act === 'add' ? 'FFD1242F' : v._act === 'reduce' ? 'FF0969DA' : null;
    if (color) row.getCell(5).font = { bold: true, color: { argb: color } };
  });
  var buf = await wb.xlsx.writeBuffer();
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  var cu = onlyKey || document.getElementById('f-cust').value;
  a.download = 'vcenter_rightsizing_' + (cu ? safePart(custName(cu)) + '_' : '') + new Date().toISOString().slice(0, 10) + '.xlsx';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
load();
</script>
